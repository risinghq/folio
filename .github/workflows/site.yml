name: site

on:
  push:
    branches:
      - "master"
    paths:
      - "site/**"
      - "src/**"
      - "theme/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - ".github/workflows/site.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - run: bun install --frozen-lockfile

      - run: bun run build:site

      # The org secrets reach this public repository. A pull request only
      # builds, so a change that breaks the site fails before it merges.
      - name: Deploy to folio.rising.sh
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:site
