name: release

# Pull requests and manual runs verify and package the release without
# publishing it.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Release notes name this version
        run: |
          version=$(jq -r .version package.json)
          expected="folio $version is out."
          first=$(head -n 1 .github/release-notes.md)
          if [ "$first" != "$expected" ]; then
            echo "::error::first line of .github/release-notes.md is '$first', expected '$expected'"
            exit 1
          fi

  package:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - run: bun install --frozen-lockfile

      - name: Pack the tarball
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Tarball installs and exports the API
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/package/*.tgz
          node --input-type=module -e '
            const { folio } = await import("@risinghq/folio");
            const { start } = await import("@risinghq/folio/client");
            if (typeof folio !== "function" || typeof start !== "function") {
              throw new Error("missing export");
            }
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  github:
    needs: [verify, tag, package]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/package/*.tgz
          --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
